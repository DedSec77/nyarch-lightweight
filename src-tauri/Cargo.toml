[package]
name = "nyarch-lightweight"
version = "0.1.0"
description = "nyarch — lightweight desktop shell (loads the live site)"
authors = ["nyarch"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "nyarch_lightweight_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
